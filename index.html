<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMIS Purnia - Cloud ICT Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #004a99; --secondary: #f4f4f4; --success: #28a745; --danger: #dc3545; --warning: #ff9800; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--secondary); }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; position: relative; }
        .container { padding: 15px; max-width: 1200px; margin: auto; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; color: #333; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #app-content { display: none; }

        .sync-bar { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        
        .grade-nav { display: flex; overflow-x: auto; gap: 8px; padding: 15px 0; }
        button { padding: 8px 15px; border-radius: 5px; cursor: pointer; border: 1px solid var(--primary); background: white; color: var(--primary); }
        button.active { background: var(--primary); color: white; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }

        .table-wrapper { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; min-width: 80px; }
        th { background: #f8f9fa; font-size: 0.85rem; }
        .student-name { position: sticky; left: 0; background: white; font-weight: bold; min-width: 160px; text-align: left; border-right: 2px solid #004a99; }
        
        .btn-add { background: var(--success); color: white; border: none; }
        .btn-del { background: var(--danger); color: white; border: none; font-size: 10px; padding: 3px 6px; }
        .btn-cloud { background: var(--warning); color: white; border: none; font-weight: bold; }
        .controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        input[type="text"], input[type="password"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }

        /* Added specific styles for the new inputs */
        .marks-input { width: 40px; padding: 2px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px; margin-top: 4px; }
        .cell-container { display: flex; flex-direction: column; align-items: center; }
        .check-group { display: flex; gap: 4px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>BOMIS Purnia Portal</h2>
        <input type="password" id="passInput" placeholder="Enter Password"><br><br>
        <button class="btn-add" onclick="checkPassword()" style="width: 100%">Access Tracker</button>
    </div>
</div>

<div id="app-content">
    <header>
        <h1>ICT Progress Tracker</h1>
        <button onclick="logout()" style="position:absolute; right:15px; top:20px;">Logout</button>
    </header>

    <div class="sync-bar">
        <span>Cloud Status: <strong id="status">Local Mode</strong></span>
        <button class="btn-cloud" onclick="syncWithCloud()">☁️ Sync to Google Sheets</button>
    </div>

    <div class="container">
        <div class="grade-nav" id="gradeNav"></div>

        <div class="card">
            <h2 id="currentGradeTitle">Grade 3</h2>
            <div class="controls">
                <input type="text" id="chapterInput" placeholder="New Chapter Name..." style="flex-grow:1">
                <button class="btn-add" onclick="addChapter()">+ Chapter</button>
                <input type="file" id="excelUpload" accept=".xlsx, .xls" style="display:none" onchange="importExcel(this)">
                <button onclick="document.getElementById('excelUpload').click()">📁 Import Excel</button>
            </div>

            <div class="table-wrapper" id="tableContainer"></div>

            <div class="controls" style="margin-top:20px; border-top:1px solid #eee; padding-top:20px;">
                <input type="text" id="studentInput" placeholder="New Student Name..." style="flex-grow:1">
                <button class="btn-add" onclick="addStudent()">+ Student</button>
            </div>
        </div>

        <button onclick="downloadReport()" style="width:100%; background:#333; color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">Download CSV Backup</button>
    </div>
</div>

<script>
    const PASS = "BOMIS2026"; 
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwQnF75zbZXwDd8HsSZ9nK45b2dFh_vRHcKlmHOxHi4EuTS5mVBeuykTAaJuofZBAe7/exec"; 

    let db = JSON.parse(localStorage.getItem('bomis_ict_db')) || {
        currentGrade: 'Grade 3',
        grades: { 'Grade 3': { students: [], chapters: [] }, 'Grade 4': { students: [], chapters: [] }, 'Grade 5': { students: [], chapters: [] }, 'Grade 6': { students: [], chapters: [] }, 'Grade 7': { students: [], chapters: [] }, 'Grade 8': { students: [], chapters: [] } }
    };

    let syncTimer;

    function checkPassword() {
        if (document.getElementById('passInput').value === PASS) {
            const expiry = new Date().getTime() + (24 * 60 * 60 * 1000);
            localStorage.setItem('bomis_session', expiry);
            unlockApp();
        } else { alert("Wrong Password"); }
    }

    function unlockApp() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        loadFromCloud();
        render();
    }

    function logout() { localStorage.removeItem('bomis_session'); location.reload(); }

    window.onload = () => {
        const session = localStorage.getItem('bomis_session');
        if (session && new Date().getTime() < session) unlockApp();
    };

    function saveData() { 
        localStorage.setItem('bomis_ict_db', JSON.stringify(db)); 
        render(); 

        document.getElementById('status').innerText = "Waiting to sync...";
        clearTimeout(syncTimer);
        
        syncTimer = setTimeout(() => {
            syncWithCloud();
        }, 2000); 
    }

    async function syncWithCloud() {
        if (!CLOUD_URL || CLOUD_URL.includes("PASTE_YOUR")) return;
        document.getElementById('status').innerText = "Syncing...";
        try {
            await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(db) });
            document.getElementById('status').innerText = "Cloud Synced ✅";
        } catch (e) { document.getElementById('status').innerText = "Sync Failed ❌"; }
    }

    async function loadFromCloud() {
        try {
            const response = await fetch(CLOUD_URL);
            const cloudData = await response.json();
            if (cloudData.grades) {
                db = cloudData;
                saveData();
                document.getElementById('status').innerText = "Cloud Data Loaded";
            }
        } catch (e) { console.log("Cloud unavailable"); }
    }

    function render() {
        const nav = document.getElementById('gradeNav');
        nav.innerHTML = Object.keys(db.grades).map(g => `<button class="${db.currentGrade === g ? 'active' : ''}" onclick="switchGrade('${g}')">${g}</button>`).join('');
        document.getElementById('currentGradeTitle').innerText = db.currentGrade;
        
        const data = db.grades[db.currentGrade];
        let html = `<table><tr><th class="student-name">Student Name</th>`;
        data.chapters.forEach((ch, i) => {
            // Header updated with BK label
            html += `<th>${ch}<br><button class="btn-del" onclick="deleteChapter(${i})">x</button><br><small>CW | HW | BK</small></th>`;
        });
        html += `<th>Action</th></tr>`;

        data.students.forEach((stu, sIdx) => {
            html += `<tr><td class="student-name">${stu.name}</td>`;
            data.chapters.forEach((ch) => {
                const p = stu.progress[ch] || { cw: false, hw: false, bk: false, marks: '' };
                html += `<td>
                    <div class="cell-container">
                        <div class="check-group">
                            <input type="checkbox" ${p.cw ? 'checked' : ''} onchange="toggleTask(${sIdx}, '${ch}', 'cw')">
                            <input type="checkbox" ${p.hw ? 'checked' : ''} onchange="toggleTask(${sIdx}, '${ch}', 'hw')">
                            <input type="checkbox" ${p.bk ? 'checked' : ''} onchange="toggleTask(${sIdx}, '${ch}', 'bk')">
                        </div>
                        <input type="number" class="marks-input" placeholder="Mks" value="${p.marks || ''}" onchange="updateMarks(${sIdx}, '${ch}', this.value)">
                    </div>
                </td>`;
            });
            html += `<td><button class="btn-del" onclick="deleteStudent(${sIdx})">Del</button></td></tr>`;
        });
        html += `</table>`;
        document.getElementById('tableContainer').innerHTML = html;
    }

    function toggleTask(sIdx, ch, type) {
        const stu = db.grades[db.currentGrade].students[sIdx];
        if(!stu.progress[ch]) stu.progress[ch] = { cw: false, hw: false, bk: false, marks: '' };
        stu.progress[ch][type] = !stu.progress[ch][type];
        saveData();
    }

    // New logic for saving Marks
    function updateMarks(sIdx, ch, val) {
        const stu = db.grades[db.currentGrade].students[sIdx];
        if(!stu.progress[ch]) stu.progress[ch] = { cw: false, hw: false, bk: false, marks: '' };
        stu.progress[ch].marks = val;
        saveData();
    }

    function switchGrade(g) { db.currentGrade = g; render(); }
    function addChapter() {
        const val = document.getElementById('chapterInput').value;
        if(val) { db.grades[db.currentGrade].chapters.push(val); document.getElementById('chapterInput').value = ''; saveData(); }
    }
    function deleteChapter(idx) { if(confirm("Delete Chapter?")) { db.grades[db.currentGrade].chapters.splice(idx, 1); saveData(); } }
    function addStudent() {
        const val = document.getElementById('studentInput').value;
        if(val) { db.grades[db.currentGrade].students.push({ name: val, progress: {} }); document.getElementById('studentInput').value = ''; saveData(); }
    }
    function deleteStudent(idx) { if(confirm("Remove Student?")) { db.grades[db.currentGrade].students.splice(idx, 1); saveData(); } }

    function importExcel(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
            if (rows.length) {
                db.grades[db.currentGrade].chapters = rows[0].slice(1);
                db.grades[db.currentGrade].students = rows.slice(1).map(r => ({ name: r[0], progress: {} }));
                saveData();
            }
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    function downloadReport() {
        const data = db.grades[db.currentGrade];
        let csv = "Student," + data.chapters.map(ch => `${ch} CW,${ch} HW,${ch} BK,${ch} Marks`).join(",") + "\n";
        data.students.forEach(stu => {
            csv += stu.name + "," + data.chapters.map(ch => {
                const p = stu.progress[ch] || {};
                return `${p.cw ? 'Y' : 'N'},${p.hw ? 'Y' : 'N'},${p.bk ? 'Y' : 'N'},${p.marks || ''}`;
            }).join(",") + "\n";
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = `BOMIS_${db.currentGrade}_Report.csv`;
        a.click();
    }
</script>
</body>
</html>
